<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Create Your CampQuest Family Account</title>
<meta name="description" content="Create a free CampQuest family account: reserve camp weeks, track skills, get daily photo feeds and manage everything about your child's summer in one place.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="page-transition active"><div class="pt-logo"><span class="pt-ring"></span></div></div>
<a class="skip-link" href="#main">Skip to main content</a>

<main id="main" class="auth-shell" aria-label="Create account">
  <div class="auth-card" data-reveal>
    <div class="auth-brand">
      <a class="logo" href="index.html" aria-label="CampQuest home"><img class="logo-img" src="images/logo.png" alt="" width="42" height="42">Camp<em>Quest</em></a>
      <span class="auth-brand-tagline">Kids Summer Camp &amp; Activity Program</span>
    </div>

    <h1>Create Your Account</h1>
    <p class="auth-subtitle">Join CampQuest — free forever, you only pay when you reserve a week.</p>

    <form data-validate data-success-title='Account created! <svg class="inline-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8Z"/></svg>' data-success-msg="Welcome kit is on its way to your inbox." id="signup-form">
      <div class="form-field">
        <label for="su-name">Full Name <span class="req">*</span></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <input id="su-name" class="form-control" type="text" name="name" placeholder="Alex Morgan" required autocomplete="name">
        </div>
        <small class="field-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span></span></small>
      </div>

      <div class="form-field">
        <label for="su-email">Email Address <span class="req">*</span></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <input id="su-email" class="form-control" type="email" name="email" placeholder="parent@email.com" required autocomplete="email" inputmode="email" spellcheck="false">
        </div>
        <small class="field-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span></span></small>
      </div>

      <div class="form-field">
        <label for="su-pass">Password <span class="req">*</span></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="su-pass" class="form-control" type="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-meter weak" data-strength="#su-pass" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="strength-text">Use 8+ characters with letters, numbers &amp; symbols</p>
        <small class="field-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span></span></small>
      </div>

      <div class="form-field">
        <label for="su-confirm">Confirm Password <span class="req">*</span></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="su-confirm" class="form-control" type="password" name="confirm-password" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <small class="field-error" id="su-confirm-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span></span></small>
      </div>

      <label class="form-check" style="margin-bottom:10px">
        <input type="checkbox" required data-required-msg="Please accept the terms to continue." id="su-terms" name="terms">
        <span>I agree to the <a href="terms.html" style="color:var(--brand)">Terms &amp; Conditions</a> and <a href="privacy.html" style="color:var(--brand)">Privacy Policy</a>.</span>
      </label>
      <label class="form-check" style="margin-bottom:20px">
        <input type="checkbox" checked name="newsletter">
        <span>Send me early-bird alerts and camp guides (monthly, no spam).</span>
      </label>

      <button type="submit" class="btn btn-accent btn-lg btn-block">Create Account<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    </form>

    <div class="auth-divider" aria-hidden="true">or sign up with</div>

    <div class="social-grid" aria-label="Social signup options">
      <button type="button" class="btn-social" data-social="google" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.31v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.09Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"/><path fill="#FBBC05" d="M5.84 14.09A6.97 6.97 0 0 1 5.48 12a6.97 6.97 0 0 1 .36-2.09V7.07H2.18A11 11 0 0 0 1 12a11 11 0 0 0 1.18 4.93l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38a6.32 6.32 0 0 1 4.43 1.73l3.32-3.32A10.96 10.96 0 0 0 12 1C7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53Z"/></svg>
        Google
      </button>
      <button type="button" class="btn-social" data-social="apple" aria-label="Continue with Apple">
        <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.6 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Apple
      </button>
    </div>

    <p class="auth-alt">Already have an account? <a href="login.html">Log in instead</a></p>
  </div>
</main>

<script src="js/main.js"></script>
<script>
  (function(){
    var form = document.getElementById('signup-form');
    var pass = document.getElementById('su-pass');
    var confirm = document.getElementById('su-confirm');
    var confirmError = document.getElementById('su-confirm-error');
    function validateConfirm(){
      if(!confirm) return true;
      var mismatch = confirm.value && pass.value !== confirm.value;
      var msg = mismatch ? 'Passwords do not match.' : '';
      if(!confirm.value && confirm.required) msg = 'This field is required.';
      else if(confirm.value && confirm.value.length < 8) msg = 'Must be at least 8 characters.';
      if(confirmError){
        var span = confirmError.querySelector('span');
        if(span) span.textContent = msg;
        confirmError.classList.toggle('show', !!msg);
      }
      confirm.classList.toggle('invalid', !!msg);
      return !msg;
    }
    if(confirm && pass){
      confirm.addEventListener('input', validateConfirm);
      confirm.addEventListener('blur', validateConfirm);
      pass.addEventListener('input', function(){ if(confirm.value) validateConfirm(); });
      if(form){
        form.addEventListener('submit', function(e){
          if(!validateConfirm()){
            e.preventDefault();
            e.stopImmediatePropagation();
            confirm.focus();
            CampQuest.toast('error','Check the form','Passwords do not match.');
          }
        }, true);
      }
    }
    document.querySelectorAll('[data-social]').forEach(function(b){
      b.addEventListener('click', function(){
        var label = b.getAttribute('data-social');
        var name = label.charAt(0).toUpperCase()+label.slice(1);
        CampQuest.toast('info', name + ' sign-up', 'Social authentication is UI-only in this demo. Use the form to create your account.');
      });
    });
  })();
</script>
</body>
</html>
